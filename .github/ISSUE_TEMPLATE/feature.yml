name: ✨ Feature request
description: Suggest an enhancement or new capability
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's the user need or pain point this addresses?
      placeholder: "As an investor, I can't compare three startups side-by-side without re-fetching each one."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A short description of what you're suggesting. Specific UX, page, or API ideas welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you think about and why didn't you pick it?

  - type: dropdown
    id: scope
    attributes:
      label: Affected area
      multiple: true
      options:
        - Investor experience (screener, dashboard, due diligence)
        - Startup experience (registration, metrics publish)
        - Governance / staking
        - Anchor program (new instruction)
        - Security / RLS
        - Developer experience (tooling, CI, docs)
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Why this matters
      description: Who benefits, and how does this advance the trust-layer mission?
