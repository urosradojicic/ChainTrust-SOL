name: CodeQL

# CodeQL static analysis. Runs on every PR + weekly on master.
# Free for public repos. Findings appear in the Security tab.
#
# Languages analysed: TypeScript/JavaScript only — Rust (Anchor program)
# is covered by `cargo audit` separately and CodeQL doesn't yet support
# the Anchor framework's macro expansions cleanly.

on:
  push:
    branches: [master, merged-ai-roadmap-v2]
  pull_request:
    branches: [master, merged-ai-roadmap-v2]
  schedule:
    # Sunday 06:00 UTC. Catches advisories that landed mid-week.
    - cron: '0 6 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Default + security-and-quality query packs for high coverage
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
