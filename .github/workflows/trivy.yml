name: Trivy filesystem scan

# Catches dependency CVEs + IaC misconfigurations CodeQL doesn't see.
# Uploads SARIF to the Security tab so findings are tracked alongside CodeQL.

on:
  push:
    branches: [master, merged-ai-roadmap-v2]
  pull_request:
    branches: [master, merged-ai-roadmap-v2]
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy fs scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          exit-code: '0'  # Report findings, don't fail the build —
                          # we accept some deferred highs (bigint-buffer)
                          # documented in SECURITY.md.

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
