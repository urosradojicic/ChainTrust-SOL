name: CI

# Runs lint + typecheck + test + build on every push and PR.
# Designed for the hackathon timeline: fail fast, surface broken code
# before it reaches `master` or `merged-ai-roadmap-v2`.

on:
  push:
    branches: [master, merged-ai-roadmap-v2, dodavanje-api-za-ai]
  pull_request:
    branches: [master, merged-ai-roadmap-v2]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      # Use `npm ci` for deterministic installs — refuses to run if
      # `package-lock.json` is out of sync with `package.json`, which
      # forces drift to be a deliberate commit instead of a CI surprise.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Secret scan (regex pre-flight, see scripts/secret-scan.mjs)
        run: node scripts/secret-scan.mjs --all

      - name: Lint
        run: npm run lint
        continue-on-error: true # surfacing 116 known issues to fix in M3

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (production)
        run: npm run build

      - name: Generate SBOM (CycloneDX)
        run: |
          node scripts/generate-sbom.mjs
          echo "### SBOM" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          jq '{components: (.components | length), generated: .metadata.timestamp}' sbom.cyclonedx.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-${{ github.sha }}
          path: sbom.cyclonedx.json
          retention-days: 90

      - name: Report bundle sizes
        run: |
          echo "### Bundle sizes" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist/assets/*.js | sort -hr | head -15 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
